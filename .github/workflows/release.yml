name: Publicar versão (Windows)

# Publica sozinho a cada push na main que mude o jogo ou o app (e também pelo botão Run workflow).
# A versão é gerada aqui: 0.1.<número da execução>, sempre maior que a anterior. Não precisa mexer no package.json.
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'electron/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write   # só o necessário para criar o release e enviar os arquivos

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Gerar instalador
        run: npm run build

      - name: Publicar no GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = node -p "require('./package.json').version"
          Get-ChildItem dist -File | Format-Table Name, Length
          $files = "dist/Pirate-MMO-Setup-$v.exe", "dist/Pirate-MMO-Setup-$v.exe.blockmap", "dist/latest.yml"
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Arquivo ausente: $f" } }
          gh release create "v$v" @files --title "Pirate MMO $v" --notes "Versão $v. Quem já tem o jogo recebe a atualização ao abrir."
