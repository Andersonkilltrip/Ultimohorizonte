name: Publicar versão (Windows)

# Rodar manualmente: aba Actions > "Publicar versão (Windows)" > Run workflow.
# Antes, suba a versão no package.json (ex.: npm.cmd version 0.1.1 --no-git-tag-version) e faça push.
on:
  workflow_dispatch:

permissions:
  contents: write   # só o necessário para criar o release e enviar os arquivos

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador e publicar no GitHub Releases
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
